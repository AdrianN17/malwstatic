name: Build, Release & Deploy Pages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Malwstatic ${{ github.ref_name }}"
          body: |
            ## Malwstatic ${{ github.ref_name }}

            Single-file release — download `index.html` and open it in any browser (no server required).

            > **Note:** requires an internet connection on first load to fetch the Rizin WASM engine.
          files: dist/index.html
          fail_on_unmatched_files: true

  deploy:
    needs: build-and-release
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            adriann17/malwstatic:latest
            adriann17/malwstatic:${{ github.ref_name }}

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          export HUB_TOKEN=$(
            curl -s -X POST "https://hub.docker.com/v2/users/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])"
          )

          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ["HUB_TOKEN"]

          with open("README.md", "r") as f:
              content = f.read()

          data = json.dumps({"full_description": content}).encode()

          req = urllib.request.Request(
              "https://hub.docker.com/v2/repositories/adriann17/malwstatic/",
              data=data,
              method="PATCH",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
              },
          )

          with urllib.request.urlopen(req) as resp:
              print("Updated:", resp.status)
          EOF
