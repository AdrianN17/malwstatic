<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malwstatic</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #272822;
        color: #f8f8f2;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        background: #1e1f1c;
        border-bottom: 1px solid #49483e;
        flex-shrink: 0;
        align-items: center;
      }

      .but {
        padding: 6px 14px;
        background: #2d2e2a;
        border: 1px solid #49483e;
        border-radius: 6px;
        color: #75715e;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        user-select: none;
      }

      .but:hover {
        background: #3e3d32;
        border-color: #ae81ff;
        color: #f8f8f2;
      }

      .but:active {
        background: #49483e;
      }

      #drawflow {
        flex: 1;
        position: relative;
        width: 100%;
        background: #272822;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* ── Drawflow node & connection styles ── */
      .drawflow, .drawflow .parent-node { position: relative }
      .parent-drawflow { display: flex; overflow: hidden; touch-action: none; outline: 0 }
      .drawflow { width: 100%; height: 100%; user-select: none; perspective: 0 }

      .drawflow .drawflow-node {
        display: flex;
        align-items: center;
        position: absolute;
        background: #2d2e2a;
        width: max-content;
        min-width: 260px;
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid #49483e;
        color: #f8f8f2;
        z-index: 2;
        padding: 12px 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        transition: border-color 0.2s, box-shadow 0.2s;
        font-size: 13px;
      }
      .drawflow .drawflow-node.selected {
        border-color: #a6e22e;
        box-shadow: 0 0 0 2px rgba(166,226,46,0.25), 0 4px 20px rgba(0,0,0,0.5);
      }
      .drawflow .drawflow-node:hover { cursor: move; border-color: #75715e }
      .drawflow .drawflow-node .inputs, .drawflow .drawflow-node .outputs { width: 0 }
      .drawflow .drawflow-node .drawflow_content_node { width: auto; display: block }

      .drawflow .drawflow-node .input, .drawflow .drawflow-node .output {
        position: relative;
        width: 14px;
        height: 14px;
        background: #272822;
        border-radius: 50%;
        border: 2px solid #75715e;
        cursor: crosshair;
        z-index: 1;
        margin-bottom: 5px;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      .drawflow .drawflow-node .input { left: -23px; top: 2px; background: #3e3d32 }
      .drawflow .drawflow-node .output { right: 1px; top: 2px }
      .drawflow .drawflow-node .input.used,
      .drawflow .drawflow-node .output.used {
        background: #f92672;
        border-color: #c4134f;
      }
      .drawflow .drawflow-node .input:hover,
      .drawflow .drawflow-node .output:hover {
        background: #ae81ff;
        border-color: #ae81ff;
        transform: scale(1.3);
      }

      .drawflow svg { z-index: 0; position: absolute; overflow: visible !important }
      .drawflow .connection { position: absolute; pointer-events: none; aspect-ratio: 1/1 }
      .drawflow .connection .main-path {
        fill: none;
        stroke-width: 3px;
        stroke: #ae81ff;
        pointer-events: all;
        transition: stroke 0.2s;
      }
      .drawflow .connection .main-path:hover { stroke: #a6e22e; cursor: pointer }
      .drawflow .connection .main-path.selected { stroke: #a6e22e }
      .drawflow .connection .point {
        cursor: move;
        stroke: #ae81ff;
        stroke-width: 2;
        fill: #2d2e2a;
        pointer-events: all;
      }
      .drawflow .connection .point.selected,
      .drawflow .connection .point:hover { fill: #a6e22e; stroke: #a6e22e }
      .drawflow .main-path { fill: none; stroke-width: 3px; stroke: #ae81ff }

      .toolbar-sep {
        width: 1px;
        background: #49483e;
        align-self: stretch;
        margin: 0 4px;
      }

      .app-title {
        font-size: 15px;
        font-weight: 700;
        color: #a6e22e;
        letter-spacing: 0.04em;
        padding-right: 8px;
        border-right: 1px solid #49483e;
        margin-right: 4px;
      }

      .file-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .file-name {
        font-size: 12px;
        color: #75715e;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-name.chosen { color: #f8f8f2; }

      /* ── Comment styles ── */
      .instr-comment, .func-comment {
        flex: 1;
        color: #e6db74;
        font-style: italic;
        outline: none;
        white-space: nowrap;
        overflow: hidden;
        min-width: 4px;
      }
      .instr-comment:empty::before,
      .func-comment:empty::before {
        content: '; …';
        color: rgba(230, 219, 116, 0.2);
        pointer-events: none;
        font-style: italic;
      }
      .ref-comment {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: all;
        z-index: 10;
        color: #e6db74;
        font-size: 11px;
        font-style: italic;
        background: rgba(39, 40, 34, 0.95);
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid #ae81ff;
        box-shadow: 0 0 6px rgba(174, 129, 255, 0.45);
        outline: none;
        white-space: nowrap;
        overflow: hidden;
        display: block;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .ref-comment:empty::before {
        content: '; …';
        color: rgba(230, 219, 116, 0.2);
        pointer-events: none;
      }
      .pe-comment {
        color: #e6db74;
        font-style: italic;
        font-size: 13px;
        outline: none;
        min-width: 80px;
        max-width: 260px;
        white-space: nowrap;
        overflow: hidden;
      }
      .pe-comment:empty::before {
        content: 'PE comment…';
        color: rgba(230, 219, 116, 0.2);
        pointer-events: none;
      }

      /* ── Collapse button ── */
      .collapse-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #75715e;
        cursor: pointer;
        font-size: 13px;
        padding: 0 3px;
        line-height: 1;
        user-select: none;
        transition: color 0.15s;
      }
      .collapse-btn:hover { color: #f92672; }
      .pin-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #75715e;
        cursor: pointer;
        font-size: 11px;
        padding: 0 3px;
        line-height: 1;
        user-select: none;
        transition: color 0.15s;
      }
      .pin-btn:hover { color: #ae81ff; }
      .drawflow-node.pinned {
        border-color: #e6db74;
        background: #302f25;
        box-shadow: 0 0 0 2px rgba(230, 219, 116, 0.25), 0 4px 20px rgba(0,0,0,0.5);
      }
      .drawflow-node.pinned .drawflow_content_node strong {
        color: #e6db74 !important;
      }

      /* ── Hidden nodes dropdown ── */
      .hidden-nodes-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .hidden-dropdown {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        background: #1e1f1c;
        border: 1px solid #49483e;
        border-radius: 6px;
        padding: 4px 0;
        z-index: 200;
        min-width: 220px;
        max-height: 320px;
        overflow-y: auto;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      }
      .hidden-dropdown.open { display: block; }
      .hidden-dropdown-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
        color: #f8f8f2;
        user-select: none;
        transition: background 0.1s;
      }
      .hidden-dropdown-item:hover { background: #3e3d32; }
      .hidden-dropdown-item input[type="checkbox"] {
        accent-color: #a6e22e;
        cursor: pointer;
        flex-shrink: 0;
      }

      /* ── Highlight on right-click ── */
      .instr-row.highlighted {
        background: rgba(253, 151, 31, 0.18);
        border-radius: 3px;
        outline: 1px solid rgba(253, 151, 31, 0.35);
        outline-offset: -1px;
      }
      .drawflow-node.node-highlighted {
        border-color: #fd971f;
        box-shadow: 0 0 0 2px rgba(253, 151, 31, 0.3), 0 4px 20px rgba(0,0,0,0.5);
      }

      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #2d2e2a;
        border: 1px solid #a6e22e;
        color: #a6e22e;
        padding: 8px 18px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 10000;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .drawflow-delete { display: none !important; }
      .drawflow-delete {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: #f92672;
        color: #fff;
        z-index: 4;
        border: none;
        font-weight: 700;
        border-radius: 50%;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 2px 8px rgba(249,38,114,0.5);
      }
      .drawflow > .drawflow-delete { margin-left: -11px; margin-top: 11px }
      .parent-node .drawflow-delete { right: -11px; top: -11px }

      /* ── Main selector ── */
      .main-select-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .main-select {
        padding: 4px 8px;
        background: #2d2e2a;
        border: 1px solid #49483e;
        border-radius: 6px;
        color: #f8f8f2;
        font-size: 12px;
        cursor: pointer;
        max-width: 200px;
        outline: none;
        transition: border-color 0.15s;
      }
      .main-select:hover, .main-select:focus { border-color: #e6db74; }
      .main-select option { background: #1e1f1c; }

      /* ── Navigation controls ── */
      .nav-controls {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .nav-btn {
        padding: 4px 10px;
        background: #2d2e2a;
        border: 1px solid #49483e;
        border-radius: 5px;
        color: #75715e;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        user-select: none;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .nav-btn:hover { background: #3e3d32; border-color: #ae81ff; color: #f8f8f2; }
      .nav-btn:active { background: #49483e; }

      /* ── Minimap ── */
      #minimapPanel {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1a1b18;
        border: 1px solid #49483e;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        z-index: 100;
        user-select: none;
        resize: both;
        min-width: 120px;
        min-height: 80px;
      }
      #minimapPanel.collapsed #minimapCanvas { display: none; }
      #minimapHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
        background: #1e1f1c;
        border-bottom: 1px solid #49483e;
        font-size: 11px;
        color: #75715e;
        cursor: move;
      }
      #minimapToggle {
        background: none;
        border: none;
        color: #75715e;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0 2px;
        transition: color 0.15s;
      }
      #minimapToggle:hover { color: #f8f8f2; }
      #minimapCanvas {
        display: block;
        cursor: crosshair;
        width: 200px;
        height: 150px;
      }

      /* ── Hamburger / Function panel ── */
      .func-panel-btn {
        background: #2d2e2a;
        border: 1px solid #49483e;
        border-radius: 6px;
        color: #75715e;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 10px;
        line-height: 1;
        user-select: none;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .func-panel-btn:hover { background: #3e3d32; border-color: #ae81ff; color: #f8f8f2; }
      .func-panel-btn.active { border-color: #a6e22e; color: #a6e22e; background: #2d2e2a; }

      .func-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100vh;
        background: #1a1b18;
        border-left: 1px solid #49483e;
        z-index: 300;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -4px 0 20px rgba(0,0,0,0.6);
      }
      .func-panel.open { transform: translateX(0); }

      .func-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid #49483e;
        flex-shrink: 0;
        background: #1e1f1c;
      }
      .func-panel-header span {
        font-size: 11px;
        font-weight: 700;
        color: #75715e;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .func-panel-close {
        background: none;
        border: none;
        color: #75715e;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
        line-height: 1;
        border-radius: 4px;
        transition: color 0.15s, background 0.15s;
      }
      .func-panel-close:hover { color: #f92672; background: rgba(249,38,114,0.12); }

      .func-search-wrap {
        padding: 8px 10px;
        flex-shrink: 0;
        border-bottom: 1px solid #2d2e2a;
      }
      .func-search {
        width: 100%;
        padding: 6px 10px;
        background: #2d2e2a;
        border: 1px solid #49483e;
        border-radius: 6px;
        color: #f8f8f2;
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .func-search:focus { border-color: #ae81ff; }
      .func-search::placeholder { color: #49483e; }

      .func-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .func-list::-webkit-scrollbar { width: 5px; }
      .func-list::-webkit-scrollbar-track { background: transparent; }
      .func-list::-webkit-scrollbar-thumb { background: #49483e; border-radius: 3px; }

      .func-item {
        padding: 7px 14px;
        font-size: 12px;
        color: #f8f8f2;
        cursor: pointer;
        overflow: hidden;
        transition: background 0.1s, color 0.1s;
        font-family: 'Consolas', 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .func-item:hover { background: #2d2e2a; color: #a6e22e; }
      .func-item-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .func-item-offset {
        font-size: 10px;
        color: #49483e;
        transition: color 0.1s;
      }
      .func-item:hover .func-item-offset { color: #75715e; }
      .func-empty {
        padding: 16px 14px;
        font-size: 12px;
        color: #49483e;
        font-style: italic;
      }
    </style>
</head>
<body>

    <div class="toolbar">
        <span class="app-title">Malwstatic <span style="font-size:10px;font-weight:400;color:#75715e;letter-spacing:0;">v1.0.0</span></span>

        <span class="file-label">
            <label class="but" for="pefileInput">PE Binary</label>
            <span class="file-name" id="pefileName">No file chosen</span>
        </span>
        <input type="file" id="pefileInput" name="pefileInput" accept=".exe" hidden />

        <div class="toolbar-sep"></div>

        <span class="file-label">
            <button class="but" id="yamlBtn">YAML File</button>
            <span class="file-name" id="yamlFileName">No file chosen</span>
        </span>
        <input type="file" id="yamlFileInput" name="yamlFileInput" accept=".yaml" hidden />

        <div class="toolbar-sep"></div>

        <span id="peCommentWrap" class="file-label" style="display:none">
            <span style="color:#75715e;font-size:12px;flex-shrink:0;">PE:</span>
            <span id="peComment" contenteditable="true" class="pe-comment"></span>
        </span>

        <div class="toolbar-sep" id="hiddenSep" style="display:none"></div>
        <div class="hidden-nodes-wrap" id="hiddenNodesWrap" style="display:none">
            <button class="but" id="hiddenNodesBtn">Hidden: <span id="hiddenCount">0</span></button>
            <div class="hidden-dropdown" id="hiddenDropdown"></div>
        </div>

        <div class="toolbar-sep" id="hideUnrefSep" style="display:none"></div>
        <button class="but" id="hideUnreferencedBtn" style="display:none">Hide unreferenced</button>

        <div class="toolbar-sep" id="mainSelSep" style="display:none"></div>
        <div class="main-select-wrap" id="mainSelectWrap" style="display:none">
            <label style="font-size:12px;color:#75715e;flex-shrink:0;">Main:</label>
            <select id="mainSelect" class="main-select"></select>
        </div>

        <div style="flex:1"></div>

        <!-- Navigation controls (always visible) -->
        <div class="nav-controls">
            <button class="nav-btn" id="zoomInBtn"  title="Zoom in (+)">+</button>
            <button class="nav-btn" id="zoomOutBtn" title="Zoom out (-)">−</button>
            <button class="nav-btn" id="resetZoomBtn" title="Reset zoom (0)">1:1</button>
        </div>
        <div class="toolbar-sep" id="funcPanelSep" style="display:none"></div>
        <button class="func-panel-btn" id="funcPanelBtn" title="Functions list" style="display:none">☰</button>
    </div>

    <!-- Floating minimap -->
    <div id="minimapPanel">
        <div id="minimapHeader">
            <span>Map</span>
            <button id="minimapToggle" title="Collapse">−</button>
        </div>
        <canvas id="minimapCanvas" width="200" height="150"></canvas>
    </div>

    <!-- Function list panel -->
    <div class="func-panel" id="funcPanel">
        <div class="func-panel-header">
            <span>Functions</span>
            <button class="func-panel-close" id="funcPanelClose">✕</button>
        </div>
        <div class="func-search-wrap">
            <input type="text" class="func-search" id="funcSearch" placeholder="Search functions…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="func-list" id="funcList"></div>
    </div>

    <div id="drawflow"></div>

    <div id="saveToast" class="toast"></div>
    <script src="https://indalok.github.io/rzwasi/rizin.js"></script>
    <script type="module" src="./src/init.ts"></script>
</body>
</html>
